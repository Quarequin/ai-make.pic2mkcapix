<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">

		<style> html, body { background-color: #000; color: #fff; } </style>
		<style>
/* style.css — Optimized with display: block/inline/inline-block/none as primary */
*, *::before, *::after { box-sizing: border-box; }

:root {
	--bg-color: #1a1b26;
	--text-color: #a9b1d6;
	--border-color: #383e5a;
	--accent-color: #7aa2f7;
	--terminal-green: #9ece6a;
	--panel-bg: #1f2335;
	--status-bg: #e0af68;
	--status-text: #1d202f;
	--main-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
}

body {
	font-family: var(--main-font);
	font-size: 14px;
	padding: 15px;
	background-color: var(--bg-color);
	color: var(--text-color);
	margin: 0 auto;
	transition: background-color 0.3s ease, color 0.3s ease;
}

body > h1 { position: relative; z-index: 720; }

input[disabled] { pointer-events: none; cursor: not-allowed; }

/* ============================================================
	 PAGE LOADER
	 ============================================================ */
#page-loader {
	position: fixed;
	top: 0;
	left: 0;
	width: 128%;
	height: 128%;
	background: var(--bg-color);
	z-index: 512;
	transition: opacity 0.5s ease, visibility 0.5s ease;
}

#page-loader > .loader-content {
	position: fixed;
	top: calc(64% - 150px);
	left: 0;
	text-align: center;
	width: 100%;
	height: 100px;
}

@keyframes fadeOutOnPageLoaded {
	from { opacity: 1; }
	to { opacity: 0; }
}

@keyframes scaleUpOnPageLoaded {
	to { transform: scale(192%, 192%); }
}

#page-loader.hidden {
	animation: fadeOutOnPageLoaded 0.5s ease-out;
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}

#page-loader.hidden > .loader-content {
	animation: scaleUpOnPageLoaded 0.5s ease-out;
}

.loader-content {
	text-align: center;
	display: block;
}

.loader-spinner {
	width: 50px;
	height: 50px;
	border: 4px solid var(--border-color);
	border-top: 4px solid var(--accent-color);
	border-radius: 50%;
	animation: spin 1s linear infinite;
	margin: 0 auto 20px auto;
	display: block;
}

.loader-text {
	font-size: 18px;
	font-weight: bold;
	color: var(--accent-color);
	margin-bottom: 8px;
	display: block;
}

.loader-sub {
	font-size: 13px;
	color: var(--text-color);
	opacity: 0.7;
	display: block;
}

@keyframes spin {
	0% { transform: rotate(0deg); }
	100% { transform: rotate(360deg); }
}

#parameters {
	border: 1px solid var(--terminal-green);
	background: var(--bg-color);
	color: var(--text-color);
	margin: 5px 0;
	padding: 7.5px;
	border-radius: 0.3em;
	display: block;
}

#parameters > * {
	margin-bottom: 20px;
	display: block;
}

#parameters > *:last-child { margin-bottom: 0; }

.settings-group { display: block; }

.settings-group::after {
	content: "";
	display: block;
	clear: both;
}

.half {
	display: block;
	float: left;
	width: 48%;
	min-width: 300px;
}

.size-settings-grid {
	background: var(--panel-bg);
	padding: 7px;
	border-radius: 6px;
	border: 1px solid var(--border-color);
	margin-bottom: 15px;
	display: block;
}

.size-settings-grid::after {
	content: "";
	display: block;
	clear: both;
}

.size-settings-grid label {
	margin: 6px 0;
	display: block;
	cursor: pointer;
}

.size-settings-grid label.full-row {
	width: 100%;
	clear: both;
	display: block;
}

.size-settings-grid label:not(.full-row) {
	display: block;
	float: left;
	width: 45%;
	padding-top: 4px;
}

.size-settings-grid input[type="number"] {
	margin: 4px 0;
	display: block;
	float: right;
	width: 50%;
}

.dropdown-selection-group {
	padding: 12px;
	border: 1px dashed var(--border-color);
	border-radius: 0.5em;
	clear: both;
	margin-top: 15px;
	background: var(--panel-bg);
	display: block;
}

.dropdown-label {
	margin-top: 0;
	margin-bottom: 8px;
	font-weight: bold;
	color: var(--accent-color);
	display: block;
}

.custom-dropdown {
	width: 100%;
	background-color: var(--bg-color);
	color: var(--text-color);
	border: 1px solid var(--border-color);
	border-radius: 0.3em;
	padding: 8px;
	font-family: var(--main-font);
	font-size: 13px;
	display: block;
}

.custom-dropdown optgroup {
	font-weight: bold;
	color: var(--accent-color);
	background: var(--panel-bg);
}

.custom-dropdown option {
	color: var(--text-color);
	background: var(--bg-color);
}

.action-buttons {
	display: block;
	width: 100%;
	margin-top: 15px;
	text-align: center;
}

.action-buttons::after {
	content: "";
	display: block;
	clear: both;
}

.action-buttons button {
	display: block;
	float: left;
	width: 32%;
	margin-right: 2%;
	color: var(--text-color);
	background-color: var(--bg-color);
	border: 1px solid var(--border-color);
	border-radius: 1em;
	padding: 12px 8px;
	cursor: pointer;
	font-size: 13px;
	text-align: center;
}

.action-buttons button:last-child {
	margin-right: 0;
	display: block;
}

.action-buttons button:disabled {
	border-color: var(--border-color);
	border-style: dashed;
	color: #666;
	cursor: not-allowed;
	opacity: 0.5;
}

.colorboard {
	display: block;
	float: right;
	width: 48%;
}

.colorboard .colorpad {
	display: block;
	margin-top: 10px;
}

.colorboard .colorpad::after {
	content: "";
	display: block;
	clear: both;
}

.colorboard .colorpad .color-pair {
	display: block;
	float: left;
	width: 31.33%;
	margin: 1% 1% 1% 0;
	background: var(--panel-bg);
	padding: 6px;
	border-radius: 4px;
	border: 1px solid var(--border-color);
}

.colorboard .colorpad .color-pair input[type="color"] {
	padding: 0px;
	width: 1.3em;
	margin-right: 5px;
	display: inline-block;
}

.colorboard .colorpad .color-pair label {
	display: inline-block;
	margin: 0;
	width: 50px;
	font-size: 11px;
	vertical-align: middle;
}

.colorboard .colorpad .color-pair .colortext {
	display: inline-block;
	margin: 0;
	width: calc(100% - 75px);
	font-size: 11px;
	padding: 2px;
	vertical-align: middle;
	font-family: monospace;
}

label { display: block; margin: 10px 0; }

input {
	background-color: var(--bg-color);
	border-color: var(--border-color);
	color: var(--text-color);
	border-style: solid;
	border-radius: 0.3em;
	padding: 5px;
	font-family: var(--main-font);
}

div.tab-panel textarea {
	clear: both;
	display: block;
	border-radius: 1.2em;
	background-color: var(--bg-color);
	color: var(--terminal-green);
	width: 100%;
	padding: 15px;
	min-height: 20rem;
	margin-top: 15px;
	resize: none;
	white-space: pre;
	overflow: auto;
	font-family: monospace;
	border: 1px solid var(--border-color);
}

#status {
	margin-bottom: 10px;
	background-color: var(--status-bg);
	color: var(--status-text);
	padding: 5px;
	border-radius: 0.3em;
	display: inline-block;
	font-weight: bold;
}

#status {
	position: sticky;
	top: 10px;
	z-index: 100;
}

.image-preview-container {
	display: none;
	margin: 20px 0;
	width: 100%;
}

.image-preview-container::after {
	content: "";
	display: block;
	clear: both;
}

.preview-box {
	display: block;
	float: left;
	width: 49%;
	margin-right: 2%;
	background: var(--panel-bg);
	border: 1px dashed var(--accent-color);
	border-radius: 8px;
	padding: 12px;
}

.preview-box:last-child {
	margin-right: 0;
	float: right;
	display: block;
}

.preview-box h3 {
	margin-top: 0;
	margin-bottom: 10px;
	font-size: 13px;
	color: var(--text-color);
	opacity: 0.8;
}

#original-preview-zone {
	width: 100%;
	display: block;
	text-align: center;
}

#original-preview-zone img, canvas {
	width: 100%;
	height: auto;
	object-fit: contain;
	image-rendering: pixelated;
	background-image:
		linear-gradient(45deg, #222 25%, transparent 25%),
		linear-gradient(-45deg, #222 25%, transparent 25%),
		linear-gradient(45deg, transparent 75%, #222 75%),
		linear-gradient(-45deg, transparent 75%, #222 75%);
	background-size: 10px 10px;
	background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
	background-color: #151515;
	border-radius: 4px;
	padding: 5px;
	margin: 0 auto;
	display: block;
}

.resolution-info {
	font-size: 11px;
	color: var(--accent-color);
	background: var(--bg-color);
	padding: 4px 8px;
	border-radius: 4px;
	margin-bottom: 8px;
	border: 1px solid var(--border-color);
	font-family: monospace;
	display: inline-block;
}

div.output {
	display: block;
	width: 100%;
	padding: 0;
	margin: 0;
	border: none;
	text-align: center;
}

body > img:not(.show) {
	position: absolute;
	right: -10000%;
	top: -10000%;
}

#info {
	background-color: var(--bg-color);
	border: 1px solid var(--terminal-green);
	color: var(--text-color);
	margin-bottom: 1em;
	padding: 0.5em 1.5em;
	border-radius: 1.5em;
	display: block;
}

input[type="file"] {
	background-color: var(--bg-color);
	border-color: var(--border-color);
	color: var(--text-color);
	padding: 0.8em;
	border: 1px dashed var(--accent-color);
	display: block;
	margin-bottom: 15px;
	width: 100%;
	max-width: 400px;
}

.palette-loader-container {
	margin-bottom: 15px;
	background: var(--panel-bg);
	padding: 10px;
	border-radius: 6px;
	border: 1px solid var(--border-color);
	display: block;
}

.palette-loader-container label {
	margin: 0 0 8px 0;
	font-size: 13px;
	color: var(--accent-color);
	display: block;
}

.palette-loader-container input[type="file"] {
	margin: 0;
	padding: 5px;
	font-size: 12px;
	border-color: var(--border-color);
	display: block;
}

#notification-popup-overlay {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.6);
	z-index: 10000;
	backdrop-filter: blur(2px);
	text-align: center;
	padding-top: 50px;
}

.popup-error-card {
	display: inline-block;
	text-align: left;
	background: var(--panel-bg);
	color: var(--accent-color);
	border: 1px solid var(--border-color);
	border-radius: 8px;
	width: 90%;
	max-width: 550px;
	box-shadow: 0 10px 30px rgba(0,0,0,0.7);
	font-family: monospace;
	overflow: hidden;
	animation: slideDownFade 0.3s ease-out;
}

.popup-header {
	background: var(--bg-color);
	padding: 12px 16px;
	font-weight: bold;
	border-bottom: 1px solid var(--border-color);
	display: block;
}

.popup-header::after {
	content: "";
	display: block;
	clear: both;
}

.popup-header span {
	float: left;
	line-height: 24px;
	display: inline-block;
}

.popup-header .popup-close-btn {
	float: right;
	display: inline-block;
}

.popup-body {
	padding: 16px;
	font-size: 13px;
	color: var(--text-color);
	display: block;
}

.popup-controls {
	margin-top: 12px;
	display: block;
}

.popup-toggle-btn {
	background: var(--bg-color);
	color: var(--accent-color);
	border: 1px solid var(--border-color);
	padding: 5px 10px;
	cursor: pointer;
	border-radius: 4px;
	font-size: 11px;
}

.popup-toggle-btn:hover { opacity: 0.9; }

.popup-body textarea#popup-err-stack {
	display: none;
	resize: none;
	background: #0d0d0d;
	padding: 10px;
	border-radius: 4px;
	border: 1px solid #252525;
	overflow-x: auto;
	color: #ff8888;
	font-size: 12px;
	margin-top: 10px;
	width: 100%;
	height: 200px;
	overflow-y: auto;
}

.popup-close-btn {
	background: var(--accent-color);
	color: var(--status-text);
	border: none;
	padding: 6px 14px;
	cursor: pointer;
	font-family: monospace;
	font-weight: bold;
	border-radius: 4px;
	font-size: 12px;
}

.popup-close-btn:hover { opacity: 0.9; }

@keyframes slideDownFade {
	from { transform: translateY(-20px); opacity: 0; }
	to { transform: translateY(0); opacity: 1; }
}

.palette-header-row {
	display: block;
	margin-bottom: 6px;
}

.palette-header-row::after {
	content: "";
	display: block;
	clear: both;
}

.palette-header-row > span {
	float: left;
	line-height: 28px;
	display: inline-block;
}

.palette-action-btns {
	float: right;
	display: inline-block;
}

.palette-slot-btn {
	background: var(--bg-color);
	color: var(--accent-color);
	border: 1px solid var(--border-color);
	border-radius: 4px;
	padding: 3px 9px;
	cursor: pointer;
	font-size: 12px;
	font-family: var(--main-font);
	margin-left: 4px;
}

.palette-slot-btn:disabled {
	opacity: 0.4;
	cursor: not-allowed;
}

.palette-slot-btn:hover:not(:disabled) {
	background: var(--panel-bg);
}

.output-tabs {
	display: block;
	margin-top: 15px;
	border-bottom: 1px solid var(--border-color);
}

.output-tabs::after {
	content: "";
	display: block;
	clear: both;
}

.tab-btn {
	display: block;
	float: left;
	background: var(--bg-color);
	color: var(--text-color);
	border: 1px solid var(--border-color);
	border-bottom: none;
	border-radius: 4px 4px 0 0;
	padding: 7px 18px;
	cursor: pointer;
	font-size: 13px;
	font-family: var(--main-font);
	margin-right: 4px;
	opacity: 0.6;
}

.tab-btn.active {
	background: var(--panel-bg);
	color: var(--accent-color);
	opacity: 1;
	font-weight: bold;
	border-bottom: 1px solid var(--panel-bg);
	margin-bottom: -1px;
	position: relative;
	z-index: 1;
}

.tab-btn:disabled {
	opacity: 0.3;
	cursor: not-allowed;
}

.tab-panel { display: none; }

.tab-panel.active { display: block; }

#ascii-output {
	font-size: 9px;
	line-height: 1.1;
	letter-spacing: 0;
	white-space: pre;
}

#ascii-sub-options {
	margin-top: 8px;
	padding-top: 8px;
	border-top: 1px dashed var(--border-color);
	display: none;
}

#ascii-sub-options label {
	margin: 6px 0 4px 0;
	font-size: 12px;
	color: var(--accent-color);
	display: block;
}

#ascii-width-input {
	width: 80px;
	display: inline-block;
}

/* ==========================================================================
	 RESPONSIVE LAYER (Float & Percentages only)
	 ========================================================================== */

@media (max-width: 960px) {
	body { padding: 10px; }
	#status { position: sticky; top: 10px; z-index: 100; }
	.half, .colorboard {
		float: none;
		width: 100%;
		margin-bottom: 25px;
		display: block;
	}
	.colorboard .colorpad .color-pair {
		width: 31.33%;
		margin: 1%;
		display: block;
	}
	.preview-box {
		float: none;
		width: 100%;
		margin-right: 0;
		margin-bottom: 20px;
		display: block;
	}
}

@media (max-width: 700px) {
	.colorboard .colorpad .color-pair {
		width: 31.33%;
		margin: 6px 3px;
		display: block;
	}
	.action-buttons button {
		width: 100%;
		float: none;
		margin-right: 0;
		margin-bottom: 12px;
		display: block;
	}
	.action-buttons button:last-child {
		margin-bottom: 0;
		display: block;
	}
}

@media (max-width: 480px) {
	.colorboard .colorpad .color-pair {
		width: 48%;
		margin: 6px 3px;
		display: block;
	}
	.size-settings-grid label:not(.full-row) { width: 48%; }
	.size-settings-grid input[type="number"] { width: 48%; }
}

@media (max-width: 340px) {
	body { max-width: 340px; }
	.colorboard .colorpad .color-pair {
		width: 100%;
		margin: 6px 0;
		float: none;
		display: block;
	}
	.size-settings-grid { clear: both; }
	.size-settings-grid label:not(.full-row) {
		float: none;
		width: 100%;
		display: block;
	}
	.size-settings-grid input[type="number"] {
		float: none;
		width: 100%;
		margin-bottom: 10px;
		display: block;
	}
}

*[state="disabled"] {
	cursor: not-allowed;
	background-color: var(--bg-color);
	color: var(--text-color);
}
		</style>

	let minDist = Infinity, nearestIndex = 1;

	for (let i = 1; i < len; i++) {
		const p = rgbPalette[i];
		const dr = r - p.r, dg = g - p.g, db = b - p.b;
		const dist = dr * dr + dg * dg + db * db;
		if (dist < minDist) {
			minDist = dist;
			nearestIndex = i;
			if (dist === 0) break;
		}
	}
	return nearestIndex;

	const key = ((r & 0xff) << 16) | ((g & 0xff) << 8) | (b & 0xff);

	if (idx === undefined) {
		idx = findNearestColor(r, g, b, rgbPalette);
		cache.set(key, idx);
	}
	return idx;

		this._subBlock = [];

		const initDict = () => {
			dict = [];
			for (let i = 0; i < clearCode; i++) dict.push([i]);
			dict.push(null); // clear
			dict.push(null); // eoi
			codeSize = minCodeSize + 1;
		};

		initDict();

		while (true) {
			const code = readCode();
			if (code === -1 || code === eoiCode) break;
			if (code === clearCode) {
				initDict();
				prevCode = -1;
				continue;
			}
			if (prevCode === -1) {
				output.push(...dict[code]);
				prevCode = code;
				continue;
			}
			let entry;
			if (code < dict.length) {
				entry = dict[code];
			} else {
				entry = [...dict[prevCode], dict[prevCode][0]];
			}
			output.push(...entry);
			dict.push([...dict[prevCode], entry[0]]);
			if (dict.length === (1 << codeSize) && codeSize < 12) codeSize++;
			prevCode = code;
		}
		return output;
	}
}

// ============================================================
// APNG DECODER (frame extraction from PNG chunks)
// ============================================================
class APNGDecoder {
	constructor(buffer) {
		this.buffer = new Uint8Array(buffer);
		this.pos = 8; // Skip PNG signature
		this.frames = [];
		this.width = 0;
		this.height = 0;
		this.playCount = 0;
	}

	_readDWord() {
		return ((this.buffer[this.pos] << 24) | (this.buffer[this.pos + 1] << 16) |
				(this.buffer[this.pos + 2] << 8) | this.buffer[this.pos + 3]) >>> 0;
	}

	_readChunk() {
		const len = this._readDWord();
		const type = String.fromCharCode(...this.buffer.slice(this.pos + 4, this.pos + 8));
		const data = this.buffer.slice(this.pos + 8, this.pos + 8 + len);
		const crc = this._readDWord();
		this.pos += 12 + len;
		return { type, len, data, crc };
	}

	decode() {
		let frameData = [];
		let actl = null;
		let idatChunks = [];
		let fctl = null;

		while (this.pos < this.buffer.length) {
			const chunk = this._readChunk();
			if (chunk.type === "IHDR") {
				this.width = (chunk.data[0] << 24) | (chunk.data[1] << 16) | (chunk.data[2] << 8) | chunk.data[3];
				this.height = (chunk.data[4] << 24) | (chunk.data[5] << 16) | (chunk.data[6] << 8) | chunk.data[7];
			} else if (chunk.type === "acTL") {
				actl = { frames: (chunk.data[0] << 24) | (chunk.data[1] << 16) | (chunk.data[2] << 8) | chunk.data[3],
						 plays: (chunk.data[4] << 24) | (chunk.data[5] << 16) | (chunk.data[6] << 8) | chunk.data[7] };
			} else if (chunk.type === "fcTL") {
				if (fctl && idatChunks.length > 0) {
					frameData.push({ fctl, idat: idatChunks });
					idatChunks = [];
				}
				fctl = {
					seq: (chunk.data[0] << 24) | (chunk.data[1] << 16) | (chunk.data[2] << 8) | chunk.data[3],
					width: (chunk.data[4] << 24) | (chunk.data[5] << 16) | (chunk.data[6] << 8) | chunk.data[7],
					height: (chunk.data[8] << 24) | (chunk.data[9] << 16) | (chunk.data[10] << 8) | chunk.data[11],
					x: (chunk.data[12] << 24) | (chunk.data[13] << 16) | (chunk.data[14] << 8) | chunk.data[15],
					y: (chunk.data[16] << 24) | (chunk.data[17] << 16) | (chunk.data[18] << 8) | chunk.data[19],
					delayNum: (chunk.data[20] << 8) | chunk.data[21],
					delayDen: chunk.data[22] === 0 ? 100 : chunk.data[22],
					dispose: chunk.data[23],
					blend: chunk.data[24]
				};
			} else if (chunk.type === "fdAT") {
				const seq = (chunk.data[0] << 24) | (chunk.data[1] << 16) | (chunk.data[2] << 8) | chunk.data[3];
				idatChunks.push(chunk.data.slice(4));
			} else if (chunk.type === "IDAT") {
				idatChunks.push(chunk.data);
			} else if (chunk.type === "IEND") {
				if (fctl && idatChunks.length > 0) {
					frameData.push({ fctl, idat: idatChunks });
				}
				break;
			}
		}

		// For simplicity, return first frame as image for now
		// Full APNG rendering requires complex compositing
		if (frameData.length > 0) {
			const first = frameData[0];
			const canvas = document.createElement("canvas");
			canvas.width = this.width;
			canvas.height = this.height;
			// Return canvas with first frame info
			this.frames.push({
				image: canvas,
				delay: (first.fctl.delayNum / first.fctl.delayDen) * 1000,
				width: this.width,
				height: this.height
			});
		}
		return this.frames;
	}
}

// ============================================================
// WEBM DECODER (uses HTMLVideoElement for frame extraction)
// ============================================================
class WebMDecoder {
	constructor(buffer, mimeType) {
		this.buffer = buffer;
		this.mimeType = mimeType || "video/webm";
	}

	async decode() {
		const blob = new Blob([this.buffer], { type: this.mimeType });
		const url = URL.createObjectURL(blob);
		const video = document.createElement("video");
		video.src = url;
		video.muted = true;
		video.playsInline = true;

		await new Promise((resolve, reject) => {
			video.onloadedmetadata = resolve;
			video.onerror = reject;
		});

		const canvas = document.createElement("canvas");
		canvas.width = video.videoWidth;
		canvas.height = video.videoHeight;
		const ctx = canvas.getContext("2d");

		const frames = [];
		const fps = 30;
		const duration = video.duration;
		const frameCount = Math.min(Math.floor(duration * fps), 300); // Max 300 frames

		video.currentTime = 0;
		await video.play();

		for (let i = 0; i < frameCount; i++) {
			video.currentTime = i / fps;
			await new Promise(r => {
				video.onseeked = r;
			});
			ctx.drawImage(video, 0, 0);
			frames.push({
				image: canvas,
				delay: 1000 / fps,
				width: video.videoWidth,
				height: video.videoHeight
			});
		}

		video.pause();
		URL.revokeObjectURL(url);
		return frames;
	}
}

// ============================================================
// ANIMATED JXL (placeholder — JXL animation not widely supported yet)
// ============================================================
class JXLDecoder {
	constructor(buffer) {
		this.buffer = buffer;
	}

	async decode() {
		// JXL animation decoding requires libjxl WASM
		// For now, return single frame using standard image decode
		const blob = new Blob([this.buffer], { type: "image/jxl" });
		const url = URL.createObjectURL(blob);
		const img = new Image();
		img.src = url;
		await new Promise((resolve, reject) => {
			img.onload = resolve;
			img.onerror = reject;
		});
		const canvas = document.createElement("canvas");
		canvas.width = img.naturalWidth;
		canvas.height = img.naturalHeight;
		const ctx = canvas.getContext("2d");
		ctx.drawImage(img, 0, 0);
		URL.revokeObjectURL(url);
		return [{
			image: canvas,
			delay: 100,
			width: img.naturalWidth,
			height: img.naturalHeight
		}];
	}
}

// ============================================================
// MAIN EXPORT: detect and decode animation

/*export*/ async function decodeAnimation(buffer, mimeType) {
	const type = ANIM_MIME_TYPES[mimeType];
	switch (type) {
		case "gif":
			return new GIFDecoder(buffer).decode();
		case "apng":
			return new APNGDecoder(buffer).decode();
		case "webm":
			return new WebMDecoder(buffer, mimeType).decode();
		case "jxl":
			return new JXLDecoder(buffer).decode();
		default:
			throw new Error("Unsupported animation format: " + mimeType);
	}
}

/*export*/ function isAnimatedFormat(mimeType) {
	return !!ANIM_MIME_TYPES[mimeType];

predefinedPaletteSelect.addEventListener("change", function () {
	const colors = predefinedPalettes[this.value];
	if (!colors) return;
	const targetCount = colors.length;
	while (colorpad.querySelectorAll(".color-pair").length > targetCount) {
		const pairs = colorpad.querySelectorAll(".color-pair");
		if (pairs.length <= MIN_PALETTE_SLOTS) break;
		colorpad.removeChild(pairs[pairs.length - 1]);
	}
	while (
		colorpad.querySelectorAll(".color-pair").length < targetCount &&
		colorpad.querySelectorAll(".color-pair").length < MAX_PALETTE_SLOTS
	) {
		const count = colorpad.querySelectorAll(".color-pair").length;
		const newPair = document.createElement("div");
		newPair.className = "color-pair";
		newPair.innerHTML = `<label>Color ${count + 1}</label><input type="color" value="#888888" /><input type="text" class="colortext" value="#888888" />`;
		colorpad.appendChild(newPair);
		bindColorPairEvents(newPair, count);
	}
	colorpad.querySelectorAll(".color-pair").forEach((pair, i) => {
		if (colors[i]) {
			pair.querySelector('input[type="color"]').value = colors[i];
			pair.querySelector(".colortext").value = colors[i];
		}
	});
	reindexColorPairs();
	statusDiv.textContent = `System: Loaded predefined "${this.value}" palette schema.`;
	addToSessionLog(
		"PALETTE",
		`Switched layout to predefined scheme: ${this.value}`,
	);
});

paletteFileInput.addEventListener("change", function (e) {
	const file = e.target.files[0];
	if (!file) return;
	const reader = new FileReader();
	reader.onerror = () =>
		displayErrorPopup(
			"Palette File IO Exception",
			"An error occurred while reading the palette source file.",
			reader.error ? reader.error.message : "Unknown fault.",
		);
	reader.onload = function (evt) {
		try {
			const colorsFound = [];
			evt.target.result.split(/\r?\n/).forEach((line) => {
				const clean = line.trim().replace(/;.*$/, "").trim();
				const match = clean.match(/#?([0-9A-Fa-f]{6,8})/);
				if (match) colorsFound.push("#" + match[1].toLowerCase());
			});
			if (colorsFound.length > 0) {
				while (
					colorpad.querySelectorAll(".color-pair").length >
					colorsFound.length
				) {
					const pairs = colorpad.querySelectorAll(".color-pair");
					if (pairs.length <= MIN_PALETTE_SLOTS) break;
					colorpad.removeChild(pairs[pairs.length - 1]);
				}
				while (
					colorpad.querySelectorAll(".color-pair").length <
						colorsFound.length
				) {
					const count = colorpad.querySelectorAll(".color-pair").length;
					if (count >= MAX_PALETTE_SLOTS) break;
					const newPair = document.createElement("div");
					newPair.className = "color-pair";
					newPair.innerHTML = `<label>Color ${count + 1}</label><input type="color" value="#888888" /><input type="text" class="colortext" value="#888888" />`;
					colorpad.appendChild(newPair);
					bindColorPairEvents(newPair, count);
				}
				colorpad.querySelectorAll(".color-pair").forEach((pair, i) => {
					if (colorsFound[i]) {
						pair.querySelector('input[type="color"]').value =
							colorsFound[i];
						pair.querySelector(".colortext").value = colorsFound[i];
					}
				});
				reindexColorPairs();
				statusDiv.textContent = `System: Loaded ${colorsFound.length} colors from palette file.`;
				addToSessionLog(
					"PALETTE",
					`Imported external palette from ${file.name}.`,
				);
			} else {
				displayErrorPopup(
					"Palette Parsing Exception",
					"No valid Hexadecimal color codes found in this file.",
					"Please verify the file contents.",
				);
			}
		} catch (err) {
			displayErrorPopup(
				"Palette Processor Runtime Fault",
				err.message,
				err.stack,
			);
		}
	};
	reader.readAsText(file);
});

function parseCurrentPalette() {
	rgbPalette = [
		{
			r: 0,
			g: 0,
			b: 0,
			a: 0,
		},
	].concat(
		Array.from(colorpad.querySelectorAll(".color-pair")).map((pair) => {
			const hex = pair.querySelector('input[type="color"]').value;
			return {
				r: parseInt(hex.substring(1, 3), 16),
				g: parseInt(hex.substring(3, 5), 16),
				b: parseInt(hex.substring(5, 7), 16),
				a: parseInt(hex.substring(7, 9), 16) || 255,
			};
		}),
	);
}

fileInput.addEventListener("change", async function () {
	textarea.value = "";
	asciiOutputTA.value = "";
	lastIndexMap = null;
	animFrames = [];
	currentFrameIndex = 0;
	isAnimating = false;

	const file = fileInput.files[0];
	if (!file || (file && !predefinedFileMediaType[file.type])) {
		if (file) statusDiv.textContent = `Invalid: ${file.name} is not image file,
		try selecting image file like .png,.jpg,.bmp,.gif,etc.`;
		else statusDiv.textContent = `Invalid: No image file.
		try selecting image file like .png,.jpg,.bmp,.gif,etc.`;
		return setButtonState("noImage");
	}

	originalMimeType = file.type || "image/png";
	const lastDotIdx = file.name.lastIndexOf(".");
	canvasLastName =
		lastDotIdx !== -1 ? file.name.substring(lastDotIdx) : ".png";
	//if (canvasLastName.toLowerCase() === ".gif") canvasLastName = ".png";

	// Check if animated format
	if (isAnimatedFormat(originalMimeType)) {
		try {
			const buffer = await file.arrayBuffer();
			uploadedFileBuffer = buffer;
			animFrames = await decodeAnimation(buffer, originalMimeType);
			if (animFrames.length > 0) {
				const firstFrame = animFrames[0];
				originalImageSize = {
					width: firstFrame.width,
					height: firstFrame.height,
				};
				if (previewContainer) previewContainer.style.display = "block";
				document.getElementById("original-res").textContent =
					`Size: ${firstFrame.width} x ${firstFrame.height} px | Frames: ${animFrames.length}`;
				const zone = document.getElementById("original-preview-zone");
				zone.innerHTML = "";
				zone.appendChild(firstFrame.image);
				document
					.querySelectorAll("input[disabled]")
					.forEach((el) => el.removeAttribute("disabled"));
				setButtonState("imageLoaded");
				updateCalculatedDimensions();
				statusDiv.textContent = `Ready: ${file.name} Loaded (${animFrames.length} frames).`;
				addToSessionLog(
					"ANIM",
					`Loaded animated ${originalMimeType} with ${animFrames.length} frames.`,
				);
			}
		} catch (animErr) {
			displayErrorPopup(
				"Animation Decode Error",
				animErr.message,
				animErr.stack,
			);
			setButtonState("noImage");
		}
		return;
	}

	// Static image
	const reader = new FileReader();
	reader.onerror = () =>
		displayErrorPopup(
			"Image File IO Exception",
			"An error occurred while loading the source image file.",
			reader.error ? reader.error.message : "Unknown fault.",
		);
	reader.onload = function (e) {
		const img = new Image();
		img.onerror = () => {
			statusDiv.textContent = "Error: Failed to decode image asset.";
			displayErrorPopup(
				"Image Decoding Exception",
				"Unable to convert this file data into a complete image.",
				"The file may be corrupted.",
			);
		};
		img.onload = () => {
			if (previewContainer) previewContainer.style.display = "block";
			originalImageSize = {
				width: img.naturalWidth,
				height: img.naturalHeight,
			};
			document.getElementById("original-res").textContent =
				`Size: ${img.naturalWidth} x ${img.naturalHeight} px`;
			const zone = document.getElementById("original-preview-zone");
			zone.innerHTML = "";
			zone.appendChild(img);
			document
				.querySelectorAll("input[disabled]")
				.forEach((el) => el.removeAttribute("disabled"));
			setButtonState("imageLoaded");
			updateCalculatedDimensions();
			statusDiv.textContent = `Ready: ${file.name} Loaded Successfully.`;
		};
		img.src = e.target.result;
	};
	reader.readAsDataURL(file);
});

function updateCalculatedDimensions() {
	if (
		!document.querySelector(
			"#original-preview-zone img, #original-preview-zone canvas",
		)
	)
		return;
	if (document.getElementById("full-width").checked) {
		inputWidth.value = 160;
		inputHeight.value = Math.round(
			originalImageSize.height * (160 / originalImageSize.width),
		);
	} else if (document.getElementById("full-height").checked) {
		inputHeight.value = 120;
		inputWidth.value = Math.round(
			originalImageSize.width * (120 / originalImageSize.height),
		);
	} else if (document.getElementById("scale").checked) {
		const f = parseFloat(inputFactor.value) || 0.1;
		inputWidth.value = Math.round(originalImageSize.width * f);
		inputHeight.value = Math.round(originalImageSize.height * f);
	}
	document.getElementById("canvas-res").textContent =
		`Size: ${inputWidth.value} x ${inputHeight.value} px`;
}

document.querySelectorAll('input[name="resize"], #factor').forEach((el) => {
	el.addEventListener("change", updateCalculatedDimensions);
	el.addEventListener("input", updateCalculatedDimensions);
});

inputWidth.addEventListener("input", function () {
	if (inputRatio.checked && originalImageSize.width > 0) {
		inputHeight.value = Math.round(
			(originalImageSize.height * (parseInt(this.value) || 1)) /
				originalImageSize.width,
		);
	}
	document.getElementById("canvas-res").textContent =
		`Size: ${inputWidth.value} x ${inputHeight.value} px`;
});
inputHeight.addEventListener("input", function () {
	if (inputRatio.checked && originalImageSize.height > 0) {
		inputWidth.value = Math.round(
			(originalImageSize.width * (parseInt(this.value) || 1)) /
				originalImageSize.height,
		);
	}
	document.getElementById("canvas-res").textContent =
		`Size: ${inputWidth.value} x ${inputHeight.value} px`;
});

// ============================================================
//  MAIN CONVERSION
// ============================================================
parametersForm.addEventListener("submit", async function (e) {
	e.preventDefault();
	if (runButton.disabled) return;

	try {
		const img = document.querySelector(
			"#original-preview-zone img, #original-preview-zone canvas",
		);
		if (!img) return;

		canvasName = `pic2pa.${new Date()
			.toISOString()
			.replace(/:/g, "-")
			.replace(/\.\d{3}/, "")}${canvasLastName}`;
		parseCurrentPalette();

		const w = parseInt(inputWidth.value) || 16;
		const h = parseInt(inputHeight.value) || 16;
		const progressInterval = 1 + (Math.sqrt(h + w) * (h / w)) | 0;
		canvas.width = w;
		canvas.height = h;

		setButtonState("processing");
		runButton.textContent = "Converting...";
		textarea.value = "Executing conversion pipeline, please wait...";
		asciiOutputTA.value = "";

		// Handle animation frames
		if (animFrames.length > 0) {
			await processAnimation(w, h);
			setButtonState("done");
			if (stopTextProcessingFlag) {
				statusDiv.textContent = "Text output generation stopped by user.";
			} else {
				statusDiv.textContent = `Success: Animation conversion completed!`;
			}
			return;
		}

		// Static image conversion
		ctx.globalCompositeOperation = "copy";
		ctx.clearRect(0, 0, w, h);
		ctx.drawImage(img, 0, 0, w, h);
		ctx.globalCompositeOperation = "source-over";
		const imgData = ctx.getImageData(0, 0, w, h);
		ctx.clearRect(0, 0, w, h);
		const outImgData = ctx.createImageData(w, h);

		const engine = engineSelect.value;
		let result;
		if (engine === "gpu") {
			result = await runGLPipeline({
				canvas,
				data: imgData.data,
				w,
				h,
				mode: modeSelect.value,
				rgbPalette,
				outImgData,
				onProgress: async (pct) => {
					runButton.textContent = `Converting... ${pct}%`;
					statusDiv.textContent = `Processing GPU pipeline... ${pct}%`;
					await new Promise((resolve) =>
						requestAnimationFrame(resolve),
					);
				},
			});
			ctx.putImageData(outImgData, 0, 0);
		} else {
			result = await runCPUPipelineFallback(imgData, w, h, outImgData);
		}
		setButtonState("almost");

		// Progressive textarea output: append line by line
		await progressiveTextOutput(result.hexString, progressInterval);

		lastIndexMap = result.indexMap;
		lastW = w;
		lastH = h;

		if (asciiEnableCheck.checked) {
			const asciiCols = parseInt(asciiWidthInput.value) || 80;
			const charsetKey = asciiCharsetSelect.value;
			asciiOutputTA.value = exportAscii(
				lastIndexMap,
				lastW,
				lastH,
				rgbPalette,
				charsetKey,
				asciiCols,
			);
			addToSessionLog(
				"ASCII",
				`ASCII output generated (${asciiCols} cols, charset: ${charsetKey}).`,
			);
		}

		setButtonState("done");
		if (stopTextProcessingFlag) {
			statusDiv.textContent = "Text output generation stopped by user.";
		} else {
			statusDiv.textContent = `Success: Conversion completed successfully!`;
		}
	} catch (pipelineErr) {
		setButtonState("imageLoaded");
		displayErrorPopup(
			"Pipeline Processing Fatal Exception",
			pipelineErr.message,
			pipelineErr.stack,
		);
	}
});

// Progressive output: show result line by line in textarea
async function progressiveTextOutput(fullString, progressInterval) {
	isTextProcessing = true;
	stopTextProcessingFlag = false;
	const lines = fullString.split("\n");
	const totalLines = lines.length;
	textarea.value = "";
	let resultString = "";
	for (let i = 0; i < totalLines; i++) {
		if (stopTextProcessingFlag) {
			if (i < totalLines) {
				resultString += lines.slice(i).join("\n");
			}
			textarea.value = resultString;
			break;
		}
		resultString += lines[i] + (i < totalLines - 1 ? "\n" : "");
		if (i % (progressInterval | 0) === 0 || i === totalLines - 1) {
			textarea.value = resultString;
			textarea.scrollTop = textarea.scrollHeight;
			const pct = ((i + 1) * 100 / totalLines).toFixed(4);
			statusDiv.textContent = `Converting to text output... ${pct}%`;
			runButton.textContent = `Converting... ${pct}%`;
			await new Promise((r) => setTimeout(r, 0));
		}
	}
	isTextProcessing = false;
	copyButton.textContent = "Copy to Clipboard";
}

// Process animation frames
async function processAnimation(w, h) {
	const allResults = [];
	const totalFrames = animFrames.length;
	const engine = engineSelect.value;

	for (let f = 0; f < totalFrames; f++) {
		const frame = animFrames[f];
		ctx.globalCompositeOperation = "copy";
		ctx.clearRect(0, 0, w, h);
		ctx.drawImage(frame.image, 0, 0, w, h);
		ctx.globalCompositeOperation = "source-over";
		const imgData = ctx.getImageData(0, 0, w, h);
		const outImgData = ctx.createImageData(w, h);

		let result;
		if (engine === "gpu") {
			result = await runGLPipeline({
				canvas,
				data: imgData.data,
				w,
				h,
				mode: modeSelect.value,
				rgbPalette,
				outImgData,
				onProgress: async () => {},
			});
		} else {
			result = await runCPUPipelineFallback(imgData, w, h, outImgData);
		}
		allResults.push(result.hexString);
		runButton.textContent = `Converting frame ${f + 1}/${totalFrames}...`;
		statusDiv.textContent = `Processing frame ${f + 1} of ${totalFrames}...`;
		await new Promise((r) => requestAnimationFrame(r));
	}
	setButtonState("almost");

	// Combine all frames
	const combined = "[\n" + allResults.join(",\n") + "\n]";
	await progressiveTextOutput(combined);
}

async function runCPUPipelineFallback(imgData, w, h, outImgData) {
	return await runConversionPipeline({
		data: imgData.data,
		w,
		h,
		mode: modeSelect.value,
		subPixelOption: subpixelSelect.value,
		rgbPalette,
		outImgData,
		onProgress: async (progressPercent) => {
			ctx.putImageData(outImgData, 0, 0);
			runButton.textContent = `Converting... ${progressPercent}%`;
			statusDiv.textContent = `Processing CPU pipeline... ${progressPercent}%`;
			await new Promise((resolve) => requestAnimationFrame(resolve));
		},
	});
}

// ---- COPY BUTTON ----
copyButton.addEventListener("click", function (e) {
	e.preventDefault();
	if (isTextProcessing) {
		stopTextProcessingFlag = true;
		return;
	}
	try {
		const activePanel = document.querySelector(".tab-panel.active");
		const ta = activePanel.querySelector("textarea");
		ta.select();
		if (!document.execCommand("copy")) throw new Error("Denied copy.");
		copyButton.textContent = "Copied!";
		setTimeout(() => {
			copyButton.textContent = "Copy to Clipboard";
		}, 2000);
	} catch (copyErr) {
		displayErrorPopup(
			"Clipboard Copy Exception",
			"Unable to copy to clipboard.",
			copyErr.message,
		);
	}
});

// ---- DOWNLOAD BUTTON ----
downloadButton.addEventListener("click", function (e) {
	e.preventDefault();
	try {
		const dataUrl = canvas.toDataURL(
			originalMimeType,
		);
		const link = document.createElement("a");
		link.href = dataUrl;
		link.download = canvasName;
		link.click();
		link.remove();
	} catch (dnErr) {
		displayErrorPopup(
			"IO Canvas Download Error",
			dnErr.message,
			dnErr.stack,
		);
	}
});
